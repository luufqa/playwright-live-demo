[pytest]
# Where pytest looks for tests
testpaths = tests
# The site under test: page.goto("/login") opens https://automationexercise.com/login
base_url = https://automationexercise.com
# Fail on unknown markers, run UI tests in Chromium, save results for the Allure report
addopts = --strict-markers --browser chromium --alluredir allure-results
markers =
    smoke: critical checks that run first
    integration: tests that use both API and UI
