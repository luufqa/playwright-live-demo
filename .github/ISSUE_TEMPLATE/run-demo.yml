name: Run demo
description: Start a real CI/CD pipeline and watch it live
title: Run demo
labels: [demo]
body:
  - type: markdown
    attributes:
      value: |
        Click **Create** and the bot starts a real pipeline: Docker build → smoke tests → regression tests → Allure report.
        You will see every step here, in this issue. One person can run one demo at a time.
  - type: checkboxes
    id: site
    attributes:
      label: About the site
      options:
        - label: I understand that the tests run on the public practice site automationexercise.com
          required: true
