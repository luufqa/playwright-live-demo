name: Demo

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ISSUE: ${{ github.event.issue.number }}

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'demo') || startsWith(github.event.issue.title, 'Run demo')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.limit.outputs.allowed }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: One demo per person
        id: limit
        env:
          AUTHOR: ${{ github.event.issue.user.login }}
        run: python3 showcase/status.py check

  demo:
    needs: check
    if: needs.check.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Wait for your turn
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: https://luufqa.github.io/playwright-live-demo/reports/${{ github.run_id }}/
          POST_URL: ""
        run: |
          mkdir -m 777 allure-results demo
          python3 showcase/status.py queue

      - name: Build base image (Debian + Python)
        run: |
          python3 showcase/status.py stage base running
          docker build --progress=plain --target base -t playwright-live-demo-base .
          python3 showcase/status.py stage base done

      - name: Build test image (Playwright + Chromium + Allure)
        run: |
          python3 showcase/status.py stage image running
          docker build --progress=plain -t playwright-live-demo .
          python3 showcase/status.py stage image done

      - name: Smoke tests
        run: >
          docker run --rm -e GH_TOKEN -e GITHUB_REPOSITORY -e DEMO_STAGE=smoke
          -v "$PWD/allure-results:/app/allure-results" -v "$PWD/demo:/app/demo"
          playwright-live-demo python -m pytest -p showcase.progress_plugin -m smoke

      - name: Regression tests
        run: >
          docker run --rm -e GH_TOKEN -e GITHUB_REPOSITORY -e DEMO_STAGE=regression
          -v "$PWD/allure-results:/app/allure-results" -v "$PWD/demo:/app/demo"
          playwright-live-demo python -m pytest -p showcase.progress_plugin -m "not smoke"

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: |
          python3 showcase/status.py stage report running
          npx -y allure@3.20.1 generate allure-results -o allure-report

      - name: Publish Allure report
        id: publish
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      - name: Publish Allure report (retry)
        id: publish_retry
        if: ${{ !cancelled() && steps.publish.outcome == 'failure' }}
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      - name: Finish and close the issue
        if: always()
        run: python3 showcase/status.py finish "${{ steps.publish.outcome == 'success' || steps.publish_retry.outcome == 'success' }}"
